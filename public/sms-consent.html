<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SMS consent and opt-in for Headliner Music Academy. Receive scheduling, billing, reminders, account updates, and promotional messages about programs and events." />
  <title>SMS Consent — Headliner Music Academy</title>
  <link rel="canonical" href="https://headlinermusicacademy.com/sms-consent" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F6F3EE; color: #1a130f; margin: 0; padding: 0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 48px 40px;
      max-width: 560px; width: 100%; margin: 24px;
      box-shadow: 0 8px 32px rgba(26,19,15,0.08);
      border: 1px solid #E8E2DA;
    }
    h1 {
      font-size: 28px; font-weight: 800; margin: 0 0 8px;
      color: #1a130f; line-height: 1.1;
    }
    .subtitle {
      font-size: 15px; color: #7A6A5A; margin: 0 0 32px; line-height: 1.5;
    }
    label.field-label {
      display: block; font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: #7A6A5A; margin-bottom: 6px;
    }
    input[type="tel"] {
      width: 100%; padding: 10px 14px; border: 1px solid #E8E2DA;
      border-radius: 10px; font-size: 14px; color: #1a130f;
      background: #FAF9F7; outline: none; transition: border-color 0.2s;
      font-family: inherit;
    }
    input[type="tel"]:focus { border-color: #FF0044; background: #fff; }
    .consent-row {
      display: flex; align-items: flex-start; gap: 10px; margin-top: 20px;
    }
    input[type="checkbox"] {
      width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0;
      accent-color: #FF0044; cursor: pointer;
    }
    .consent-text {
      font-size: 12px; color: #7A6A5A; line-height: 1.6; cursor: pointer;
    }
    .links {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid #E8E2DA;
      display: flex; gap: 20px; flex-wrap: wrap;
    }
    .links a {
      font-size: 11px; color: #7A6A5A; text-decoration: none;
      text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
    }
    .links a:hover { color: #FF0044; }
    .brand {
      display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
    }
    .brand img { height: 36px; width: auto; }
    .brand span {
      font-size: 13px; font-weight: 700; color: #7A6A5A;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="https://res.cloudinary.com/diy08lj9x/image/upload/v1780719863/Asset_2_2x_h5ziii.png" alt="Headliner Music Academy" />
      <span>Headliner Music Academy</span>
    </div>

    <h1>SMS Consent</h1>
    <p class="subtitle">
      Provide your phone number below to opt in to SMS messages from Headliner Music Academy.
      Opt-in is optional and not required to enroll or receive services.
    </p>

    <label class="field-label" for="phone">Phone number</label>
    <input type="tel" id="phone" placeholder="(916) 000-0000" />

    <div class="consent-row">
      <input type="checkbox" id="sms-consent" />
      <label class="consent-text" for="sms-consent">
        By checking this box, I agree to receive SMS messages from Headliner Music Academy
        regarding scheduling, billing, reminders, account updates, and promotional messages
        about programs and events. Message frequency varies. Reply STOP to opt out at any time.
      </label>
    </div>

    <div class="links">
      <a href="/privacy-policy">Privacy Policy</a>
      <a href="/terms-and-conditions">Terms & Conditions</a>
      <a href="/">Home</a>
    </div>
  </div>
</body>
</html>
